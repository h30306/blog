<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="940" height="520" rx="14" fill="#FFFFFF"/><rect x="20" y="40" width="120" height="56" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="80.0" y="68.0" font-size="14" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">Document</text><rect x="20" y="140" width="120" height="76" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/><text x="80.0" y="161.1" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">SpanBERT</text><text x="80.0" y="178.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">(overlapping</text><text x="80.0" y="194.9" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">segments)</text><rect x="20" y="260" width="120" height="76" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/><text x="80.0" y="281.1" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">Mention</text><text x="80.0" y="298.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">detection</text><text x="80.0" y="314.90000000000003" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">(top-K spans)</text><line x1="80" y1="96" x2="80" y2="138" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="80" y1="216" x2="80" y2="258" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="140" y1="298" x2="196" y2="298" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="198" y="24" width="500" height="470" rx="12" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 4"/><text x="210" y="38" font-size="13" text-anchor="start" dominant-baseline="middle" fill="#4B5563" font-weight="600">Clustering: process mentions x_i in document order</text><rect x="222" y="60" width="452" height="70" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="448.0" y="86.55" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">① Within-group density (WS)</text><text x="448.0" y="103.45" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">δ_j = mean cos( centroid(c_j), each mention in c_j )</text><rect x="222" y="160" width="452" height="70" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/><text x="448.0" y="186.55" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">② Coreference score</text><text x="448.0" y="203.45000000000002" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">s_c(x_i, e_j) = FFN([x_i; ẽ_j; x_i⊙ẽ_j; φ]) · δ_j + s_m(x_i)</text><rect x="222" y="260" width="452" height="70" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="448.0" y="286.55" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">③ Pick entity</text><text x="448.0" y="303.45" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">e* = argmax_j s_c(x_i, e_j)   or   ε (start a new entity)</text><rect x="222" y="360" width="452" height="80" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="448.0" y="383.1" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">④ Entity representation (ER)</text><text x="448.0" y="400.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">α = softmax(W·c_e* + b),  ẽ* = Σ α_h · mention_h</text><text x="448.0" y="416.90000000000003" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">(attention instead of a plain average)</text><line x1="448" y1="130" x2="448" y2="158" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="448" y1="230" x2="448" y2="258" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="448" y1="330" x2="448" y2="358" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><path d="M674,400 C720,400 720,95 676,95" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><text x="684" y="74" font-size="12" text-anchor="start" dominant-baseline="middle" fill="#6B7280" font-style="italic">next x_i</text><rect x="750" y="120" width="170" height="96" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/><text x="835.0" y="151.1" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">Coreference loss</text><text x="835.0" y="168.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">L_coref =</text><text x="835.0" y="184.9" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">marginal log-lik.</text><rect x="750" y="246" width="170" height="116" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="835.0" y="278.65" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">Between-group</text><text x="835.0" y="295.54999999999995" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">density (BS)</text><text x="835.0" y="312.45" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">L_BS = Σ cos(ẽ_i, ẽ_k)</text><text x="835.0" y="329.34999999999997" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">only if cos ≥ λ</text><rect x="750" y="392" width="170" height="70" rx="8" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/><text x="835.0" y="418.55" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">L = (1−r)·L_coref</text><text x="835.0" y="435.45" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">+ r·L_BS</text><line x1="835" y1="216" x2="835" y2="244" stroke="#374151" stroke-width="1.5"/><line x1="835" y1="362" x2="835" y2="390" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><text x="470" y="508" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#B91C1C">Red boxes = the three proposed components (ER, WS, BS)</text></svg>