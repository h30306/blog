78" y="210" width="130" height="44" rx="8" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="543.0" y="232.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">Sarcasm</text><rect x="624" y="210" width="130" height="44" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="689.0" y="232.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">Arousal</text><rect x="770" y="210" width="130" height="44" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="835.0" y="232.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">Valence</text><text x="470" y="290" font-size="12" text-anchor="middle" dominant-baseline="middle" fill="#6B7280">Intimidation is rare (48 of 5,926 labeled comments) while sarcasm and harassment are frequent</text></svg>