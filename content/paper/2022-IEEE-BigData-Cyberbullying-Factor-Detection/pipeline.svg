<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="940" height="330" rx="14" fill="#FFFFFF"/><rect x="24" y="40" width="150" height="96" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="99.0" y="79.55" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">PTT comments</text><text x="99.0" y="96.45" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">(several years)</text><rect x="210" y="40" width="150" height="96" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="285.0" y="71.1" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">Annotation</text><text x="285.0" y="88.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">3 annotators</text><text x="285.0" y="104.9" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">6 factors</text><line x1="174" y1="88" x2="208" y2="88" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="396" y="40" width="150" height="96" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/><text x="471.0" y="71.1" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827" font-weight="600">BERT classifier</text><text x="471.0" y="88.0" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">one per factor</text><text x="471.0" y="104.9" font-size="13" text-anchor="middle" dominant-baseline="middle" fill="#111827">h_CLS → softmax</text><line x1="360" y1="88" x2="394" y2="88" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="582" y="40" width="150" height="96" rx="8" fill